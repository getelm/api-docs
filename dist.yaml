openapi: 3.0.1
servers:
  - url: https://api.getelm.co/api
    description: Live API server
info:
  title: Elm API
  version: 1.0.0
  contact:
    name: Contact
    email: hello@getelm.co
  termsOfService: https://getelm.co/terms-of-service/
  description: >
    # Introduction

    We’ve designed the elm API to give FMCG brands and third parties easier
    access to their key sales data. See more info below on how to fetch data
    from the elm API.

    # Note on Data Freshness

    We work hard to keep our data fresh and accurate.  Our system undergoes a
    daily data synchronisation process with all retailer connections to ensure
    that our dataset accurately reflects retroactive changes made by these
    retailers. This synchronisation typically covers the previous 4-7 days,
    depending on the specific data processing practices of each retailer.


    Retailers often apply these backdated modifications to their data.  Daily
    updates are required to ensure the most up-to-date and precise historical
    data, which reflects what is available on the retailer's own platform.


    In practical terms, this means that if you were to retrieve sales totals for
    a Sunday on a Monday, the total for that Sunday may change when viewed on
    subsequent days such as Tuesday, Wednesday, or Thursday.


    To accommodate these retailer-driven data changes effectively, we recommend
    including a request for data that spans approximately the last seven days in
    every API call. By doing so, you can ensure access to the most current
    information. When adding this data to your database, you can:

    1. Keep all versions but use the most recent data.

    2. Clear the previous day's data before adding new results.


    This ensures 100% accuracy when handling retroactive changes, avoiding
    potential discrepancies of up to around 1% in historical sales totals if
    these practices are not followed.

    # Metric availability

    Which metrics a retailer can serve depends on the retailer, the level and
    the timeframe, and it changes over time.
    `/list?type=metrics&retailer={retailer}` is the source of truth. It returns
    four lists — `sku_metrics`, `store_metrics`, `sku_metrics_daily` and
    `store_metrics_daily` — where `null` means nothing is available for that
    combination.


    Requests are lenient. A metric the retailer cannot serve is left out, the
    rest is returned with a `200`, and the omitted names come back in the
    **`X-Elm-Omitted-Metrics`** response header. An unrecognised metric name is
    a `400`, as is a request where nothing can be served.


    Two limits apply to every retailer. `unit_ros`, `value_ros`,
    `ranged_stores`, `stores_selling` and `stores_with_stock` cannot be served
    at a daily timeframe. Store level daily data is kept for 14 days only.

    # API Keys

    This API relies on an API key for authentication. To generate/access your
    API key please make sure that you have admin level access to your Elm
    account. 


    To generate your API key:

    - Log in to your account and, navigate to [Account
    Settings](https://dashboard.getelm.co/account) 

    - Visit the API tab

    - On this page you will be able to generate an API key, view your key, and
    regenerate your key if your existing one is lost or exposed.


    Please note that API keys are sensitive pieces of information and as such
    should be kept secret, like a password.


    # Authentication

    Once you have your API key, you can use it for authentication by including
    it in the authorization header of your requests.


    **Headers:**

    ```

    Authorization: Token <your token>

    ```

    ## Example request

    This request can be used to test your connection to the API. A successful
    request and authorization will return `{"success":true}`

    ```

    curl --request GET \
      --url https://api.getelm.co/api/test/ \
      --header 'Authorization: <your token>'
    ```
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    errorServer:
      type: object
      properties:
        success:
          type: boolean
          description: A boolean indicating that the query was unsuccessful
        error:
          type: string
          description: Error message
      example:
        success: false
        error: Server error. Please review your request and try again
    dataSku:
      type: object
      properties:
        week:
          type: string
          description: >
            The period. Named `date` when `timeframe=daily` and `month` when
            `timeframe=monthly`.
        sku:
          type: string
          description: The product SKU
        sku_product_name:
          type: string
          description: The product SKU and product name
        metric_name:
          type: string
          description: >
            One property per requested metric, named after the metric.
            Exceptions: `unit_ros` and `value_ros` return as `average_unit_ros`
            and `stocking_point_unit_ros`, and some retailers report the average
            only. With `comparison` set, each metric gains a percentage change
            property suffixed `_ly_perc_change` or
            `_previous_period_perc_change`. Metrics that could not be served are
            absent and listed in the `X-Elm-Omitted-Metrics` header.
      example:
        week: '2022-06-12T23:00:00.000Z'
        sku: 446677
        sku_product_name: 446677 productName
        revenue: 231
    dataStore:
      type: object
      properties:
        week:
          type: string
          description: >
            The period. Named `date` when `timeframe=daily` and `month` when
            `timeframe=monthly`.
        store_id:
          type: string
          description: The store ID
        store_name:
          type: string
          description: The store name
        sku:
          type: string
          description: The product SKU
        product_name:
          type: string
          description: The product name
        metric_name:
          type: string
          description: >
            One property per requested metric, named after the metric. With
            `comparison` set, each metric gains a percentage change property
            suffixed `_ly_perc_change` or `_previous_period_perc_change`.
            Metrics that could not be served are absent and listed in the
            `X-Elm-Omitted-Metrics` header.
      example:
        week: '2022-06-12T23:00:00.000Z'
        store_id: 4
        store_name: 4 London
        sku: 446677
        product_name: productName
        revenue: 44
    action:
      type: object
      properties:
        client_name:
          type: string
          description: The client name.
        alert_date:
          type: string
          description: The date of the alert.
        sku_code:
          type: string
          description: The SKU code.
        sku_description:
          type: string
          description: The SKU name.
        retailer:
          type: string
          description: The retailer name.
        store_id:
          type: string
          description: The store ID.
        store_description:
          type: string
          description: The store name.
        action:
          type: string
          description: The action.
        action_description:
          type: string
          description: The action description.
      example:
        client_name: myCompany
        alert_date: '2022-08-15T23:00:00.000Z'
        sku_code: 33453
        sku_description: 33453 - myCompany greatProduct
        retailer: tesco
        store_id: 1111
        store_description: 3322 London
        action: no_sales
        action_description: No sales recorded for this SKU in 4 weeks
  responses:
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorServer'
    Unauthorized:
      description: >
        The API key is missing, not valid, or does not have access to the
        requested data. Sales data and actions are granted separately.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorServer'
          example:
            success: false
            error: Invalid credentials
    Forbidden:
      description: The API subscription on the account is not active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorServer'
          example:
            success: false
            error: >-
              Active API subscription not found. Please check your payment
              method or API settings
    BadRequest:
      description: >
        Bad request. The `error` property gives the cause. Common ones: a
        required parameter is missing; a metric name is not recognised; none of
        the requested metrics are available for that retailer, level and
        timeframe; the retailer has no data at that level and timeframe; a store
        level daily request asks for dates over 14 days old.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorServer'
          example:
            success: false
            error: >-
              Invalid metric in request: revenu. Available metrics for tesco at
              sku level weekly: revenue,units,availability,wastage,average_price
  parameters:
    retailer:
      in: query
      name: retailer
      required: true
      schema:
        type: string
      description: >
        Name of retailer to pull data from. Use `/list` to list available
        retailer options.


        **Note:** retailer=all applies only to SKU level data. Using
        retailer=all is equivalent to viewing the Sales Summary charts where
        retailer=sainsburys is equivalent to viewing the charts in the
        Sainsbury's dashboard.


        retailer=all supports `revenue` and `units` only, and the `/list` paths
        reject it.
      example: sainsburys
    timeframe:
      in: query
      name: timeframe
      required: true
      schema:
        type: string
        enum:
          - daily
          - weekly
          - monthly
      example: weekly
      description: >
        Return data by day, week or month.


        **Note:** fewer metrics are available daily than weekly, and some
        retailers have no daily data at all. Check `sku_metrics_daily` and
        `store_metrics_daily` in `/list?type=metrics&retailer={retailer}`.
    datefrom:
      in: query
      name: datefrom
      required: true
      schema:
        type: string
      description: Date from which to begin pulling data in the format YYYY-MM-DD
      example: '2022-08-13'
    dateto:
      in: query
      name: dateto
      required: true
      schema:
        type: string
      description: Date on which to end pulling data in the format YYYY-MM-DD
      example: '2022-10-18'
    comparison:
      in: query
      name: comparison
      required: false
      schema:
        type: string
        enum:
          - period
          - year
      description: >
        Returns an extra column for each metric selected with the value
        percentage change between the current period/year and the previous
        period/year.


        **'Period'** refers to the value for the preceding timeframe. I.e. if
        the current timeframe is 'week', the 'period' value will be the value
        for the previous week.


        **'Year'** refers to the value for the same timeframe in the previous
        year. I.e. if the current timeframe is 'week', the 'year' value will be
        the value for the same week in the previous year.
      example: period
    filter:
      in: query
      name: filter
      required: false
      schema:
        type: string
        default: sku
        enum:
          - sku
          - filter1
          - filter2
          - filter3
          - filter4
          - filter5
      description: >
        Define whether the results should be filtered by SKU or product filters
        (optional). This parameter is required if you would like to return data
        for a specific SKU or filter. 


        **Note:** When selecting filters, the filter names will be returned in
        place of SKU codes. A list of available SKU codes and filter names can
        be accessed through the `/list` path.
      example: filter2
    viewby:
      in: query
      name: viewby
      required: false
      schema:
        type: string
      description: >
        SKU code of filter name can be used to filter data down to a specific
        SKU or filter. Requires the filter parameter to be set to 'sku' or a
        specific filter. 


        **Note:** Filter names are case sensitive.
      examples:
        example1:
          summary: with filter=sku
          value: '334'
        example2:
          summary: with filter=filter1
          value: Multi pack
  headers:
    OmittedMetrics:
      description: >
        Requested metrics that were not returned, separated by commas. Present
        only when something was left out.
      schema:
        type: string
      example: unit_ros,stores_selling
security:
  - ApiKeyAuth: []
paths:
  /test:
    summary: Test your connection and credentials
    description: >-
      A simple path that can be used to test that you are correctly applying
      your credentials
    get:
      summary: Test your connection
      description: >-
        Test that you are correctly connecting to the API and return a success
        or error message accordingly.
      operationId: test_connection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: A boolean indicating that the query was successful
                example:
                  success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
  /list?type=retailers:
    summary: Get available retailers
    description: >-
      This endpoint returns a list of the retailer connections that a user has
      access to in their elm account. To add further retailers/customers please
      visit the “Manage Connections” section of your elm dashboard.
    get:
      summary: Get available retailers
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - retailers
          example: retailers
          description: Returns list of available retailers
      description: >-
        This endpoint returns a list of the retailer connections that a user has
        access to in their elm account. To add further retailers/customers
        please visit the “Manage Connections” section of your elm dashboard.


        **Note:** the list includes `all`, which aggregates across retailers.
        `all` works only on `/data?type=sku` — the `/list` paths reject it.
      operationId: get_retailers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - all
                  - amazon
                  - sainsburys
                  - shopify
                  - tesco
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
      tags:
        - List
  /list?type=metrics&retailer={retailer}:
    summary: Get available metrics
    description: >-
      Returns the metrics that can be requested for a retailer, split by level
      and timeframe. This varies by retailer and changes over time, so read it
      here rather than hardcoding a list.
    get:
      summary: Get available metrics
      description: >-
        Returns the metrics that can be requested for a retailer, split by level
        and timeframe. This varies by retailer and changes over time, so read it
        here rather than hardcoding a list.


        Each list covers one combination of level and timeframe. `null` means
        nothing is available for that combination, and requesting it returns a
        `400`. See "Metric availability" in the introduction.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - metrics
          example: metrics
          description: Returns list of available metrics by retailer
        - in: query
          name: retailer
          required: true
          schema:
            type: string
          example: sainsburys
          description: Define retailer to return list of available metrics
      operationId: get_metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    retailer:
                      type: string
                      description: The selected retailer
                    sku_metrics:
                      type: array
                      nullable: true
                      items:
                        type: string
                      description: Available for `type=sku`, weekly or monthly.
                    store_metrics:
                      type: array
                      nullable: true
                      items:
                        type: string
                      description: Available for `type=store`, weekly or monthly.
                    sku_metrics_daily:
                      type: array
                      nullable: true
                      items:
                        type: string
                      description: Available for `type=sku`, daily.
                    store_metrics_daily:
                      type: array
                      nullable: true
                      items:
                        type: string
                      description: Available for `type=store`, daily.
              example:
                - retailer: retailer_a
                  sku_metrics:
                    - revenue
                    - units
                    - average_price
                    - wastage
                  store_metrics:
                    - revenue
                    - units
                    - average_price
                    - stock
                  sku_metrics_daily:
                    - revenue
                    - units
                    - average_price
                  store_metrics_daily: null
                - retailer: retailer_b
                  sku_metrics:
                    - revenue
                    - units
                    - average_price
                  store_metrics: null
                  sku_metrics_daily: null
                  store_metrics_daily: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
      tags:
        - List
  /list?type=filters&retailer={retailer}:
    summary: Get available SKU codes and filter names
    description: >-
      This endpoint returns a list of the SKU codes and filter names that can be
      requested. To define filter names and to associate them with SKU codes
      please visit the "Product Settings" section of your elm dashboard.
    get:
      summary: Get available SKU codes and filter names
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - filters
          example: filters
          description: Returns list of available  SKU codes and filter names by retailer
        - in: query
          name: retailer
          required: true
          schema:
            type: string
          example: sainsburys
          description: >-
            Define retailer to return list of available SKU codes and filter
            names
      description: >-
        This endpoint returns a list of the SKU codes and filter names that can
        be requested. To define filter names and to associate them with SKU
        codes please visit the "Product Settings" section of your elm dashboard.
      operationId: get_filters
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku:
                    type: array
                    items:
                      type: string
                      example: '2'
                    description: >-
                      List of SKU codes. These are used in requesting data for a
                      specific SKU.
                    example:
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                  skuProductName:
                    type: array
                    items:
                      type: string
                      example: 2 - Product 2
                    description: >-
                      List of SKU codes and associated product names. Not used
                      in API requests but useful for understanding the data and
                      differentiating between SKU codes.
                    example:
                      - 1 - Product 1
                      - 2 - Product 2
                      - 3 - Product 3
                      - 4 - Product 4
                  filter1:
                    type: array
                    items:
                      type: string
                      example: IPA
                    description: >-
                      List of values associated with the first filter. These are
                      used in requesting data for a specific filter.
                    example:
                      - IPA
                      - Lager
                      - Stout
                      - Ale
                  filter2:
                    type: array
                    items:
                      type: string
                      example: IPA
                    description: >-
                      List of values associated with the second filter. These
                      are used in requesting data for a specific filter.
                    example:
                      - Multi-pack
                      - Single
                  filter3:
                    type: array
                    items:
                      type: string
                      example: IPA
                    description: >-
                      List of values associated with the third filter. These are
                      used in requesting data for a specific filter.
                    example:
                      - Chocolate
                      - Vanilla
                      - Strawberry
                      - Mint
                  filter4:
                    type: array
                    items:
                      type: string
                      example: IPA
                    description: >-
                      List of values associated with the fourth filter. These
                      are used in requesting data for a specific filter.
                    example:
                      - Snack
                      - Meal
                      - Dessert
                      - Drink
                  filter5:
                    type: array
                    items:
                      type: string
                      example: IPA
                    description: >-
                      List of values associated with the fifth filter. These are
                      used in requesting data for a specific filter.
                    example:
                      - Low
                      - Medium
                      - High
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
      tags:
        - List
  /data?type=sku&retailer={retailer}&timeframe={timeframe}&metric={metric}&datefrom={datefrom}&dateto={dateto}:
    summary: Return data by SKU
    description: Return data by SKU
    get:
      summary: Return data by SKU
      description: >-
        Retrieve SKU level sales data by retailer for the selected timeframe.
        This is best used when looking for top level sales information, rather
        than requiring sales by store data.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - sku
          example: sku
          description: Return data at SKU level
        - $ref: '#/components/parameters/retailer'
        - $ref: '#/components/parameters/timeframe'
        - in: query
          name: metric
          required: true
          schema:
            type: string
            enum:
              - revenue
              - units
              - average_price
              - availability
              - wastage
              - unit_ros
              - value_ros
              - ranged_stores
              - stores_selling
              - stores_with_stock
          description: >
            Which metric(s) to return, separated by a single comma. E.g.
            `metric=revenue,units,wastage`


            The list above is everything this endpoint can build. What a given
            retailer serves depends on the retailer and timeframe, so check
            `/list?type=metrics&retailer={retailer}`. An unavailable metric is
            left out and named in the `X-Elm-Omitted-Metrics` response header.


            `unit_ros` and `value_ros` return as `average_unit_ros` and
            `stocking_point_unit_ros`. Those two, plus `ranged_stores`,
            `stores_selling` and `stores_with_stock`, cannot be served daily.
          example: revenue
        - $ref: '#/components/parameters/datefrom'
        - $ref: '#/components/parameters/dateto'
        - $ref: '#/components/parameters/comparison'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/viewby'
      operationId: data_sku
      responses:
        '200':
          description: OK
          headers:
            X-Elm-Omitted-Metrics:
              $ref: '#/components/headers/OmittedMetrics'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dataSku'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
      tags:
        - Data
  /data?type=store&retailer={retailer}&timeframe={timeframe}&metric={metric}&datefrom={datefrom}&dateto={dateto}:
    summary: Return data by store
    description: >-
      Retrieve sales and other data points grouped by SKU and store ID / name.
      Often used where more granular data is needed, such as field team work.
    get:
      summary: Return data by Store
      description: >-
        Retrieve sales and other data points grouped by SKU and store ID / name.
        Often used where more granular data is needed, such as field team work.


        **Note:** store level daily data is kept for 14 days only. Older daily
        dates return a `400`. Weekly and monthly are not limited.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - store
          example: store
          description: Return data at store level
        - $ref: '#/components/parameters/retailer'
        - in: query
          name: timeframe
          required: true
          schema:
            type: string
            enum:
              - daily
              - weekly
              - monthly
          example: weekly
          description: >
            Return data by day, week or month.


            **Note:** far fewer retailers report store level data daily than
            weekly. Check `store_metrics_daily` in
            `/list?type=metrics&retailer={retailer}` first.
        - in: query
          name: metric
          required: true
          schema:
            type: string
            enum:
              - revenue
              - units
              - average_price
              - stock
              - wastage
              - lost_sales
          description: >
            Which metric(s) to return, separated by a single comma. E.g.
            `metric=revenue,units,stock`


            The list above is everything this endpoint can build. What a given
            retailer serves depends on the retailer and timeframe, so check
            `/list?type=metrics&retailer={retailer}`. An unavailable metric is
            left out and named in the `X-Elm-Omitted-Metrics` response header.
          example: revenue
        - $ref: '#/components/parameters/datefrom'
        - $ref: '#/components/parameters/dateto'
        - $ref: '#/components/parameters/comparison'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/viewby'
      operationId: data_store
      responses:
        '200':
          description: OK
          headers:
            X-Elm-Omitted-Metrics:
              $ref: '#/components/headers/OmittedMetrics'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dataStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
      tags:
        - Data
  /actions?retailer={retailer}:
    summary: Get all actions
    description: >-
      This endpoint returns a list of all active actions, insights and alerts as
      set out in your elm account along with accompanying information by
      retailer for a given week. This data set is often used as the first step
      in a successful field visit, for example, as it outlines problem stores.


      Note: Actions are refreshed weekly and so please plan your API requests
