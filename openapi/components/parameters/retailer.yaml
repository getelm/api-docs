in: query
name: retailer
required: true
schema:
  type: string
description: >
  Name of retailer to pull data from. Use `/list` to list available retailer options.


  **Note:** retailer=all applies only to SKU level data. Using retailer=all is equivalent to viewing the Sales Summary charts where retailer=sainsburys is equivalent to viewing the charts in the Sainsbury's dashboard.


  retailer=all supports `revenue` and `units` only, and the `/list` paths reject it.


  **Note:** retailer=ocado_foundation is for Ocado Foundation accounts. It returns one total per week for the whole account, with `sku` and `sku_product_name` as `null`. It supports `type=sku`, `timeframe=weekly` and the metrics `revenue`, `units` and `average_price` only. `filter` and `viewby` return a `400`. Use retailer=ocado for SKU level Ocado data, where your account has it.
example: sainsburys
