summary: Return data by SKU
description: Return data by SKU
get:
  summary: Return data by SKU
  description: Retrieve SKU level sales data by retailer for the selected timeframe. This is best used when looking for top level sales information, rather than requiring sales by store data.
  parameters:
    - in: query
      name: type
      required: true
      schema:
        type: string
        enum:
          - sku
      example: sku
      description: Return data at SKU level
    - $ref: ../components/parameters/retailer.yaml
    - $ref: ../components/parameters/timeframe.yaml
    - in: query
      name: metric
      required: true
      schema:
        type: string
        enum:
          - revenue
          - units
          - average_price
          - availability
          - wastage
          - unit_ros
          - value_ros
          - ranged_stores
          - stores_selling
          - stores_with_stock
      description: >
        Which metric(s) to return, separated by a single comma. E.g. `metric=revenue,units,wastage`


        The list above is everything this endpoint can build. What a given retailer serves depends on the retailer and timeframe, so check `/list?type=metrics&retailer={retailer}`. An unavailable metric is left out and named in the `X-Elm-Omitted-Metrics` response header.


        `unit_ros` and `value_ros` return as `average_unit_ros` and `stocking_point_unit_ros`. Those two, plus `ranged_stores`, `stores_selling` and `stores_with_stock`, cannot be served daily.
      example: revenue
    - $ref: ../components/parameters/datefrom.yaml
    - $ref: ../components/parameters/dateto.yaml
    - $ref: ../components/parameters/comparison.yaml
    - $ref: ../components/parameters/filter.yaml
    - $ref: ../components/parameters/viewby.yaml
  operationId: data_sku
  responses:
    "200":
      description: OK
      headers:
        X-Elm-Omitted-Metrics:
          $ref: ../components/headers/OmittedMetrics.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/dataSku.yaml
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    default:
      $ref: ../components/responses/ServerError.yaml
  tags:
    - Data
