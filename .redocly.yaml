# See https://redoc.ly/docs/cli/configuration/ for more information.
apis:
  main@v1:
    root: openapi/openapi.yaml
extends:
  - recommended
rules:
  no-unused-components: warn
  # The path keys carry query strings on purpose, so the operations read as real URLs in the
  # sidebar. That makes the linter treat {retailer} and friends as undeclared path parameters.
  path-not-include-query: off
  path-parameters-defined: off
theme:
  openapi:
    htmlTemplate: ./docs/index.html
    theme:
      colors:
        primary:
          main: "#05C6B3"
