type: object
properties:
  week:
    type: string
    description: >
      The period. Named `date` when `timeframe=daily` and `month` when `timeframe=monthly`.
  sku:
    type: string
    nullable: true
    description: The product SKU. `null` for retailers that report totals only, for example `ocado_foundation`.
  sku_product_name:
    type: string
    nullable: true
    description: The product SKU and product name. `null` for retailers that report totals only, for example `ocado_foundation`.
  metric_name:
    type: string
    description: >
      One property per requested metric, named after the metric. Exceptions: `unit_ros` and
      `value_ros` return as `average_unit_ros` and `stocking_point_unit_ros`, and some retailers
      report the average only. With `comparison` set, each metric gains a percentage change
      property suffixed `_ly_perc_change` or `_previous_period_perc_change`. Metrics that could not
      be served are absent and listed in the `X-Elm-Omitted-Metrics` header.
example:
  week: 2022-06-12T23:00:00.000Z
  sku: 446677
  sku_product_name: 446677 productName
  revenue: 231
