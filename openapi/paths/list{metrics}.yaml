summary: Get available metrics
description: >-
  Returns the metrics that can be requested for a retailer, split by level and timeframe. This varies by retailer and changes over time, so read it here rather than hardcoding a list.
get:
  summary: Get available metrics
  description: >-
    Returns the metrics that can be requested for a retailer, split by level and timeframe. This varies by retailer and changes over time, so read it here rather than hardcoding a list.


    Each list covers one combination of level and timeframe. `null` means nothing is available for that combination, and requesting it returns a `400`. See "Metric availability" in the introduction.
  parameters:
    - in: query
      name: type
      required: true
      schema:
        type: string
        enum:
          - metrics
      example: metrics
      description: Returns list of available metrics by retailer
    - in: query
      name: retailer
      required: true
      schema:
        type: string
      example: sainsburys
      description: Define retailer to return list of available metrics
  operationId: get_metrics
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                retailer:
                  type: string
                  description: The selected retailer
                sku_metrics:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Available for `type=sku`, weekly or monthly.
                store_metrics:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Available for `type=store`, weekly or monthly.
                sku_metrics_daily:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Available for `type=sku`, daily.
                store_metrics_daily:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Available for `type=store`, daily.
          example:
            - retailer: retailer_a
              sku_metrics: [revenue, units, average_price, wastage]
              store_metrics: [revenue, units, average_price, stock]
              sku_metrics_daily: [revenue, units, average_price]
              store_metrics_daily: null
            - retailer: retailer_b
              sku_metrics: [revenue, units, average_price]
              store_metrics: null
              sku_metrics_daily: null
              store_metrics_daily: null
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    default:
      $ref: ../components/responses/ServerError.yaml
  tags:
    - List
