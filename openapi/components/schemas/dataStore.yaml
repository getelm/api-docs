type: object
properties:
  week:
    type: string
    description: >
      The period. Named `date` when `timeframe=daily` and `month` when `timeframe=monthly`.
  store_id:
    type: string
    description: The store ID
  store_name:
    type: string
    description: The store name
  sku:
    type: string
    description: The product SKU
  product_name:
    type: string
    description: The product name
  metric_name:
    type: string
    description: >
      One property per requested metric, named after the metric. With `comparison` set, each metric
      gains a percentage change property suffixed `_ly_perc_change` or
      `_previous_period_perc_change`. Metrics that could not be served are absent and listed in the
      `X-Elm-Omitted-Metrics` header.
example:
  week: 2022-06-12T23:00:00.000Z
  store_id: 4
  store_name: 4 London
  sku: 446677
  product_name: productName
  revenue: 44
